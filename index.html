<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>list</title>
    <link rel="manifest" id="manifestLink">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="list">
    <meta name="theme-color" content="#1E0547">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        :root {
            --pink: #FF8FAB;
            --pink-light: #FFD6E0;
            --pink-dark: #C9596E;
            --bg: #FFF5F7;
            --card: #FFFFFF;
            --gray: #8B95A1;
            --gray-strong: #4E5968;
            --gray-light: #F5F5F5;
            --text: #191F28;
            --border: #FFE0EA;
            --border-neutral: #E5E8EB;
            --surface: #F2F4F6;
            --danger: #E42939;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        html, body { height:100%; overflow:hidden; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; background:var(--bg); color:var(--text); }
        button:focus-visible, .form-input:focus-visible, .form-textarea:focus-visible, .add-input:focus-visible, .num-input:focus-visible {
            outline:2px solid var(--pink); outline-offset:2px;
        }
        button:disabled { opacity:.45; cursor:not-allowed; }

        /* ======= SETUP SCREEN ======= */
        #setupScreen {
            min-height:100vh; padding:48px 28px 36px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:linear-gradient(160deg, #0D0129 0%, #1A0440 50%, #2D0A6B 100%);
        }

        .setup-logo {
            font-size:72px; margin-bottom:14px; animation:beat 2.4s infinite;
            filter: grayscale(1) brightness(0.1) contrast(5);
        }
        @keyframes beat { 0%,100%{transform:scale(1)} 30%{transform:scale(1.07)} 60%{transform:scale(1)} 80%{transform:scale(1.04)} }

        .setup-title {
            font-family: 'Great Vibes', cursive;
            font-size:54px; font-weight:400;
            color:#E2D0FF; letter-spacing:2px;
        }
        .setup-sub { font-size:13px; color:rgba(255,255,255,0.4); margin:10px 0 44px; line-height:1.8; text-align:center; }

        .setup-step { width:100%; display:none; }
        .setup-step.active { display:block; }

        .big-btn {
            width:100%; height:56px; border-radius:16px;
            font-size:17px; font-weight:700; border:none; cursor:pointer;
            margin-bottom:12px; transition:all .2s; font-family:inherit;
            display:flex; align-items:center; justify-content:center;
        }
        .big-btn:active { transform:scale(.97); }
        .big-btn.primary { background:#7C3AED; color:#fff; box-shadow:0 4px 22px rgba(124,58,237,.55); }
        .big-btn.secondary { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.85); border:1.5px solid rgba(155,108,248,0.35); }

        .code-box {
            background:rgba(255,255,255,0.07); border:2px dashed rgba(155,108,248,0.45);
            border-radius:20px; padding:24px; margin:18px 0;
        }
        .code-box .lbl { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:8px; }
        .code-box .code { font-size:40px; font-weight:900; letter-spacing:10px; color:#C4A9FF; }
        .code-box .hint { font-size:12px; color:rgba(255,255,255,0.35); margin-top:10px; line-height:1.6; }

        .code-input {
            width:100%; padding:16px; border:2px solid rgba(155,108,248,0.3);
            border-radius:16px; font-size:24px; font-weight:700;
            text-align:center; letter-spacing:8px; outline:none;
            margin-bottom:14px; font-family:inherit; text-transform:uppercase;
            background:rgba(255,255,255,0.08); color:#fff;
        }
        .code-input::placeholder { color:rgba(255,255,255,0.25); }
        .code-input:focus { border-color:#9B6CF8; }
        .back-link { color:rgba(255,255,255,0.38); font-size:14px; cursor:pointer; margin-top:6px; display:inline-block; padding:8px; }

        /* ======= MAIN APP ======= */
        #mainApp { display:none; flex-direction:column; height:100vh; height:-webkit-fill-available; }

        .header {
            background:#fff; border-bottom:1px solid var(--border-neutral);
            padding:calc(var(--safe-top) + 14px) 16px 14px;
            display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
        }
        .header-title { font-size:20px; font-weight:800; color:#6D28D9; letter-spacing:-0.5px; }
        .header-code {
            position:absolute; right:14px;
            font-size:11px; font-weight:700; color:var(--pink-dark);
            background:var(--bg); padding:4px 10px; border-radius:10px;
            cursor:pointer; border:1px solid var(--pink-light);
        }

        .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(68px + var(--safe-bottom)); }

        .tab-panel { display:none; padding:16px; }
        .tab-panel.active { display:block; }

        .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
        .panel-title { font-size:21px; font-weight:800; }

        .plus-btn {
            width:38px; height:38px; border-radius:50%;
            background:var(--pink); color:#fff; border:none; font-size:22px;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            box-shadow:0 3px 10px rgba(255,143,171,.45); transition:all .2s; flex-shrink:0;
        }
        .plus-btn:active { transform:scale(.87); }

        /* Bottom Nav */
        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0;
            background:#fff; border-top:1px solid var(--border-neutral);
            display:flex; padding-bottom:var(--safe-bottom); z-index:100;
        }
        .nav-btn {
            flex:1; display:flex; flex-direction:column; align-items:center;
            padding:10px 0 6px; cursor:pointer; background:none; border:none; transition:all .18s;
        }
        .nav-icon { font-size:22px; margin-bottom:3px; transition:transform .2s; }
        .nav-label { font-size:11px; color:var(--gray); font-weight:500; }
        .nav-btn.active .nav-label { color:var(--pink); font-weight:700; }
        .nav-btn.active .nav-icon { transform:scale(1.12); }

        /* List Item */
        .list-item {
            background:#fff; border-radius:18px; padding:12px 14px;
            margin-bottom:10px; border:1px solid var(--border);
            cursor:pointer; transition:all .18s;
        }
        .list-item:active { transform:scale(.975); }

        .item-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .item-main { flex:1; overflow:hidden; }
        .item-title { font-size:15px; font-weight:700; color:var(--text); line-height:1.3; }
        .item-title.done { text-decoration:line-through; color:#aaa; }
        .item-date { font-size:11px; color:var(--gray); }
        .item-footer { display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-top:5px; }
        .map-mini-btn { background:none; border:none; font-size:14px; cursor:pointer; padding:0; line-height:1; }
        .map-mini-btn:active { transform:scale(1.2); }
        .item-review { font-size:13px; color:var(--gray); margin-top:3px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .item-stars { margin-top:5px; font-size:14px; }
        .item-photos { display:flex; gap:5px; margin-top:8px; overflow:hidden; }
        .item-thumb { width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; }

        /* Side photos (spot / dining) */
        .item-side-photos { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
        .item-thumb-side { width:60px; height:60px; border-radius:10px; object-fit:cover; flex-shrink:0; display:block; }
        .side-more { width:60px; height:60px; border-radius:10px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:11px; color:#aaa; flex-shrink:0; }

        .check-btn {
            width:26px; height:26px; border-radius:50%; border:2.5px solid var(--pink-light);
            background:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
            flex-shrink:0; transition:all .2s; font-size:13px; color:#fff;
        }
        .check-btn.done { background:var(--pink); border-color:var(--pink); }
        .del-btn { background:none; border:none; color:#ddd; font-size:16px; cursor:pointer; padding:2px 0 2px 4px; flex-shrink:0; }
        .del-btn:active { color:var(--danger); }

        /* Empty */
        .empty { text-align:center; padding:60px 20px; }
        .empty-emoji { font-size:52px; margin-bottom:12px; }
        .empty-msg { font-size:14px; color:var(--gray); line-height:1.7; }

        /* ======= MODALS ======= */
        .overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.48);
            z-index:300; display:flex; align-items:flex-end;
            opacity:0; pointer-events:none; transition:opacity .28s;
        }
        .overlay.open { opacity:1; pointer-events:all; }

        .sheet {
            background:#fff; border-radius:24px 24px 0 0;
            width:100%; max-height:92vh; overflow-y:auto;
            -webkit-overflow-scrolling:touch;
            padding:0 22px calc(20px + var(--safe-bottom));
            transform:translateY(100%); transition:transform .3s ease;
        }
        .overlay.open .sheet { transform:translateY(0); }

        .sheet-handle { width:44px; height:5px; background:#E0E0E0; border-radius:3px; margin:14px auto 18px; flex-shrink:0; }
        .sheet-title { font-size:18px; font-weight:800; color:var(--text); margin-bottom:18px; padding-right:30px; }

        .detail-close {
            position:absolute; right:14px; top:12px;
            width:32px; height:32px; border-radius:50%;
            background:var(--surface); border:none; font-size:15px;
            cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10;
            transition:transform .15s;
        }
        .detail-close:active { transform:scale(.88); }

        .form-label { font-size:13px; font-weight:700; color:var(--gray); margin-bottom:7px; display:block; }

        .form-input {
            width:100%; padding:13px 15px; border:1.5px solid var(--border);
            border-radius:14px; font-size:15px; font-family:inherit;
            outline:none; background:var(--bg); margin-bottom:18px; color:var(--text);
        }
        .form-input:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,143,171,.15); }

        .form-textarea {
            width:100%; min-height:90px; padding:13px 15px;
            border:1.5px solid var(--border); border-radius:14px;
            font-size:15px; font-family:inherit; outline:none;
            resize:none; background:var(--bg); margin-bottom:18px; color:var(--text);
        }
        .form-textarea:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,143,171,.15); }

        /* Star Rating */
        .star-wrap { display:flex; gap:6px; margin-bottom:18px; }
        .star-btn { font-size:30px; background:none; border:none; cursor:pointer; line-height:1; transition:transform .1s; padding:0; }
        .star-btn:active { transform:scale(1.35); }

        /* Bucket toggle */
        .check-row {
            display:flex; align-items:center; gap:14px;
            padding:14px 16px; background:var(--bg); border-radius:14px; margin-bottom:18px; cursor:pointer;
        }
        .check-circle {
            width:28px; height:28px; border-radius:50%; border:2.5px solid var(--pink-light);
            display:flex; align-items:center; justify-content:center;
            font-size:14px; flex-shrink:0; transition:all .2s; color:#fff;
        }
        .check-circle.done { background:var(--pink); border-color:var(--pink); }
        .check-lbl { font-size:15px; font-weight:600; }

        /* Photo Grid */
        .photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
        .photo-wrap { aspect-ratio:1; border-radius:12px; overflow:hidden; position:relative; }
        .photo-wrap img { width:100%; height:100%; object-fit:cover; }
        .photo-del {
            position:absolute; top:4px; right:4px;
            width:22px; height:22px; border-radius:50%;
            background:rgba(0,0,0,.55); color:#fff; border:none;
            font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        .add-photo {
            aspect-ratio:1; border-radius:12px; border:2px dashed var(--pink-light);
            background:#FFF8FA; display:flex; flex-direction:column;
            align-items:center; justify-content:center; cursor:pointer;
            color:var(--pink-light); font-size:26px; transition:all .2s;
        }
        .add-photo span { font-size:10px; margin-top:2px; color:var(--pink-light); }
        .add-photo:active { background:var(--pink-light); }

        /* Map link row */
        .map-link-row { display:flex; gap:8px; align-items:center; margin-bottom:18px; }
        .map-go-btn {
            flex-shrink:0; height:48px; padding:0 16px; border-radius:14px;
            background:var(--pink); color:#fff; border:none;
            font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s;
            display:flex; align-items:center; justify-content:center;
        }
        .map-go-btn:active { transform:scale(.96); background:var(--pink-dark); }

        /* Action Row */
        .action-row { display:flex; gap:10px; margin-top:4px; padding-bottom:4px; }
        .save-btn {
            flex:1; height:48px; border-radius:14px;
            background:var(--pink); color:#fff; border:none;
            font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s;
            display:flex; align-items:center; justify-content:center;
        }
        .save-btn:active { transform:scale(.97); background:var(--pink-dark); }
        .del-action-btn {
            height:48px; padding:0 18px; border-radius:14px;
            background:#FFF0F0; color:var(--danger); border:none;
            font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
            display:flex; align-items:center; justify-content:center; transition:all .2s;
        }
        .del-action-btn:active { transform:scale(.97); background:#FFE1E1; }

        /* Add Sheet */
        .add-input {
            width:100%; padding:14px 16px; border:2px solid var(--border);
            border-radius:14px; font-size:16px; font-family:inherit;
            outline:none; background:var(--bg); margin-bottom:12px; color:var(--text);
        }
        .add-input:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,143,171,.15); }
        .add-confirm {
            width:100%; height:48px; border-radius:14px;
            background:var(--pink); color:#fff; border:none;
            font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s;
            display:flex; align-items:center; justify-content:center;
        }
        .add-confirm:active { transform:scale(.97); }

        /* Toast */
        .toast {
            position:fixed; bottom:calc(88px + var(--safe-bottom)); left:50%;
            transform:translateX(-50%) translateY(10px);
            background:rgba(30,30,30,.88); color:#fff;
            padding:10px 22px; border-radius:22px; font-size:14px; font-weight:500;
            opacity:0; transition:all .25s; z-index:999; white-space:nowrap; pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* Warning */
        .warn-box {
            background:#FFF3CD; border:1px solid #FFD060;
            border-radius:14px; padding:14px 16px;
            font-size:13px; color:#7A5800; margin-bottom:20px; line-height:1.6;
            width:100%;
        }

        /* ======= ESTATE ======= */
        .estate-cat-item {
            background:#fff; border-radius:18px; padding:14px 16px;
            margin-bottom:10px; border:1px solid var(--border);
            cursor:pointer; display:flex; align-items:center; gap:14px; transition:all .18s;
        }
        .estate-cat-item:active { transform:scale(.975); }
        .estate-progress { font-size:11px; color:var(--gray); margin-top:2px; }
        .estate-progress-bar { height:4px; background:var(--border); border-radius:2px; margin-top:6px; overflow:hidden; }
        .estate-progress-fill { height:100%; background:var(--pink); border-radius:2px; transition:width .3s; }
        .check-item {
            display:flex; align-items:flex-start; gap:12px;
            padding:11px 0; border-bottom:1px solid #FFF5F7; cursor:pointer;
        }
        .check-box {
            width:22px; height:22px; border-radius:6px; border:2px solid var(--pink-light);
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; margin-top:1px; transition:all .18s; font-size:13px; color:#fff;
        }
        .check-box.checked { background:var(--pink); border-color:var(--pink); }
        .check-text { font-size:14px; color:var(--text); line-height:1.5; flex:1; }
        .check-text.checked { color:#bbb; text-decoration:line-through; }
        .estate-note {
            background:#FFF8FA; border:1px solid var(--border); border-radius:12px;
            padding:10px 14px; font-size:12px; color:var(--gray); margin:12px 0; line-height:1.6;
        }
        .estate-section { font-size:13px; font-weight:700; color:var(--gray); margin:16px 0 8px; }
        .chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
        .chip {
            padding:7px 15px; border-radius:20px; font-size:13px;
            border:1.5px solid var(--border); background:#fff; cursor:pointer;
            transition:all .18s; color:var(--text);
        }
        .chip.selected { background:var(--pink); border-color:var(--pink); color:#fff; }
        .num-input-row { display:flex; align-items:center; gap:10px; margin:6px 0 12px; }
        .num-input-label { font-size:14px; font-weight:600; color:var(--text); flex:1; }
        .num-input {
            width:72px; padding:8px 10px; border:1.5px solid var(--border);
            border-radius:10px; font-size:16px; font-weight:700; text-align:center;
            outline:none; font-family:inherit; background:var(--bg); color:var(--text);
        }
        .num-input:focus { border-color:var(--pink); }
        .num-unit { font-size:13px; color:var(--gray); }
        .estate-reset-btn {
            background:none; border:1.5px solid var(--border); color:var(--gray);
            border-radius:10px; padding:6px 14px; font-size:13px; cursor:pointer;
            font-family:inherit; transition:all .18s;
        }
        .estate-reset-btn:active { background:var(--border); }

        /* ======= TRIP ======= */
        .trip-view { display:none; }
        .trip-view.active { display:block; }
        .trip-sub-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .back-btn {
            width:34px; height:34px; border-radius:50%;
            background:var(--bg); border:1.5px solid var(--border);
            font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
            flex-shrink:0; color:var(--text); transition:all .18s;
        }
        .back-btn:active { background:var(--border); }
        .trip-card-sub { font-size:12px; color:var(--gray); margin-top:3px; }
        /* Activity card */
        .act-item {
            background:#fff; border-radius:16px; padding:12px 14px;
            margin-bottom:8px; border:1px solid var(--border);
            display:flex; gap:12px; align-items:flex-start;
            cursor:pointer; transition:all .18s;
        }
        .act-item:active { transform:scale(.975); }
        .act-time-col { min-width:48px; flex-shrink:0; text-align:center; padding-top:2px; }
        .act-time { font-size:14px; font-weight:800; color:var(--pink-dark); }
        .act-body { flex:1; min-width:0; }
        .act-title { font-size:15px; font-weight:700; color:var(--text); }
        .act-memo { font-size:12px; color:var(--gray); margin-top:3px; }
        .act-stars { font-size:13px; margin-top:4px; }
        .act-del { background:none; border:none; color:#ddd; font-size:16px; cursor:pointer; padding:2px; flex-shrink:0; }
        .act-del:active { color:var(--danger); }
    </style>
</head>
<body>

<!-- ========== SETUP SCREEN ========== -->
<div id="setupScreen">
    <div class="setup-logo">🖤</div>
    <h1 class="setup-title">our record</h1>
    <p class="setup-sub">두 사람만의 특별한 공간<br>함께 만들어가는 소중한 추억</p>

    <!-- Step 1 -->
    <div class="setup-step active" id="step1">
        <button class="big-btn primary" onclick="showStep('create')">💝 새로운 커플 코드 만들기</button>
        <button class="big-btn secondary" onclick="showStep('join')">🔑 파트너 코드 입력하기</button>
    </div>

    <!-- Step Create -->
    <div class="setup-step" id="stepCreate">
        <div class="code-box">
            <div class="lbl">📋 커플 코드</div>
            <div class="code" id="genCode">------</div>
            <div class="hint">파트너에게 이 코드를 알려주세요<br>파트너도 같은 코드를 입력하면 연결돼요</div>
        </div>
        <button class="big-btn primary" onclick="startWithCode(document.getElementById('genCode').textContent)">시작하기 →</button>
        <div class="back-link" onclick="showStep('1')">← 돌아가기</div>
    </div>

    <!-- Step Join -->
    <div class="setup-step" id="stepJoin">
        <input type="text" class="code-input" id="joinInput" placeholder="XXXXXX" maxlength="6" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
        <button class="big-btn primary" onclick="joinWithCode()">연결하기 →</button>
        <div class="back-link" onclick="showStep('1')">← 돌아가기</div>
    </div>
</div>

<!-- ========== MAIN APP ========== -->
<div id="mainApp">
    <div class="header">
        <span class="header-title">list</span>
        <span class="header-code" id="headerCode" onclick="copyCode()">복사</span>
    </div>

    <div class="content" id="mainContent">
        <!-- Bucket List -->
        <div class="tab-panel active" id="tab-bucket">
            <div class="panel-header">
                <span class="panel-title">⭐ Bucket List</span>
                <button class="plus-btn" onclick="openAdd('bucket')">+</button>
            </div>
            <div id="bucket-list"></div>

// ─── State ───────────────────────────────────────
let coupleCode     = null;

// ─── Setup ───────────────────────────────────────
function showStep(s) {
    document.querySelectorAll('.setup-step').forEach(el => el.classList.remove('active'));
    if (s === 'create') {
        document.getElementById('genCode').textContent = genCode();
        document.getElementById('stepCreate').classList.add('active');
    } else if (s === 'join') {
        document.getElementById('joinInput').value = '';
        document.getElementById('stepJoin').classList.add('active');
    } else {
        document.getElementById('step1').classList.add('active');
    }

function genCode() {
    const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length:6}, () => c[Math.floor(Math.random()*c.length)]).join('');
}

function joinWithCode() {
    const v = document.getElementById('joinInput').value.trim();
    if (v.length < 4) { showToast('코드를 입력해주세요'); return; }
    startWithCode(v);
}

function startWithCode(code) {
    if (!db) { showToast('Firebase 설정이 필요합니다'); return; }
    coupleCode = code;
    localStorage.setItem('coupleCode', code);
    initApp();
}

// ─── App Init ───────────────────────────────────
function initApp() {
    document.getElementById('setupScreen').style.display = 'none';
    const app = document.getElementById('mainApp');
    app.style.display = 'flex';
    app.style.flexDirection = 'column';
    document.getElementById('headerCode').textContent = '🔑 ' + coupleCode;

    db.ref('couples/' + coupleCode).on('value', snap => {
        const raw = snap.val() || {};
        data.bucket = raw.bucket || {};
        data.spot   = raw.spot   || {};
        data.dining = raw.dining || {};
        tripData    = raw.trip   || {};
        estateData  = raw.estate || {};
        renderAll();
        if (currentTab === 'trip') renderCurrentTripView();
        if (currentTab === 'estate') renderCurrentEstateView();
    }, err => { showToast('연결 오류: ' + err.message); });
}

function copyCode() {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(coupleCode).then(() => showToast('코드 복사됨! 📋'));

}

function switchTab(tab) {
    currentTab = tab;

function renderAll() {
    renderList('bucket');
    renderList('spot');
    renderList('dining');
}

function renderList(type) {
    const el = document.getElementById(type + '-list');
    const items = data[type] || {};
    const sorted = Object.entries(items).sort((a,b) => (b[1].dateAdded||'') > (a[1].dateAdded||'') ? 1 : -1);

    if (!sorted.length) {
        const icons = {bucket:'⭐', spot:'🗺️', dining:'🍴'};
        const msgs  = {bucket:'Add your first\nbucket list!', spot:'Add a place\nyou want to visit!', dining:'Add a restaurant\nyou want to try!'};
        el.innerHTML = `<div class="empty"><div class="empty-emoji">${icons[type]}</div><div class="empty-msg">${msgs[type]}</div></div>`;
        return;
    }
    el.innerHTML = sorted.map(([id, item]) => itemHTML(type, id, item)).join('');
}

function itemHTML(type, id, item) {
    const date   = item.dateAdded ? new Date(item.dateAdded).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}) : '';
    const photos = Array.isArray(item.photos) ? item.photos : [];

    let inner = '';
    if (type === 'bucket') {
        const done = !!item.completed;
        inner = `
            <div class="item-row">
                <div class="item-title${done?' done':''}">${esc(item.title)}</div>
                <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
                    <button class="del-btn" onclick="event.stopPropagation();delItem('bucket','${id}')">✕</button>
                    <button class="check-btn${done?' done':''}" onclick="event.stopPropagation();toggleDone('${id}',${done})">${done?'✓':''}</button>
                </div>
            </div>
            ${item.description ? `<div class="item-review">${esc(item.description)}</div>` : ''}
            <div class="item-footer"><span class="item-date">${date}</span></div>`;
    } else {
        const r = item.rating || 0;
        const floatPhotos = photos.length
            ? `<div style="float:right;display:flex;gap:4px;margin-left:10px;">` +
              photos.slice(0,3).map(p => `<img style="width:72px;height:72px;border-radius:10px;object-fit:cover;" src="${p}" alt="">`).join('') +
              (photos.length > 3 ? `<span style="font-size:11px;color:#aaa;align-self:center;">+${photos.length-3}</span>` : '') +
              `</div>`
            : '';
        inner = `
            <div style="position:relative;padding-right:28px;width:100%;">
                <button class="del-btn" style="position:absolute;top:0;right:0;" onclick="event.stopPropagation();delItem('${type}','${id}')">✕</button>
                ${floatPhotos}
                <div class="item-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px;">${esc(item.title)}</div>
                <div class="item-stars" style="margin-bottom:3px;">${[1,2,3,4,5].map(i => i<=r?'⭐':'☆').join('')}</div>
                ${item.review ? `<div class="item-review">"${esc(item.review)}"</div>` : ''}
                <div class="item-footer">
                    <span class="item-date">${date}</span>
                    ${item.mapUrl ? `<button class="map-mini-btn" data-url="${esc(item.mapUrl)}" onclick="event.stopPropagation();openMapLink(this.dataset.url)">🗺️</button>` : ''}
                </div>
                <div style="clear:both;"></div>
            </div>`;
    }

    // bucket: photos below / spot+dining: photos already on the right inside inner
    const bottomPhotos = (type === 'bucket' && photos.length)
        ? `<div class="item-photos">${photos.slice(0,3).map(p=>`<img class="item-thumb" src="${p}" alt="">`).join('')}${photos.length>3?`<div class="item-thumb" style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#888;border-radius:10px;">+${photos.length-3}</div>`:''}</div>`
        : '';

    return `<div class="list-item" onclick="openDetail('${type}','${id}')">${inner}${bottomPhotos}</div>`;
}

function openAdd(type) {

        const payload = {

function renderDetail() {
    const t = detailType, it = detailItem;
    const photos = it.photos || [];

    const photoGrid = `
        <div class="photo-grid">
            ${photos.map((p,i) => `<div class="photo-wrap"><img src="${p}" alt=""><button class="photo-del" onclick="removePhoto(${i})">✕</button></div>`).join('')}
            <div class="add-photo" onclick="pickPhoto()"><span>+</span><span>사진</span></div>
        </div>`;

    let html = '';
    if (t === 'bucket') {
        const done = !!it.completed;
        html = `
            <div class="sheet-title">${esc(it.title)}</div>
            <div class="check-row" onclick="toggleDetailDone()">
                <div class="check-circle${done?' done':''}" id="dCircle">${done?'✓':''}</div>
                <span class="check-lbl" id="dLabel">${done?'완료했어요! 🎉':'아직 완료 전이에요'}</span>
            </div>
            <label class="form-label">메모 📝</label>

            <label class="form-label">사진 📸</label>
            ${photoGrid}
            <div class="action-row">
                <button class="save-btn" onclick="saveDetail()">저장하기 💾</button>
                <button class="del-action-btn" onclick="deleteDetail()">삭제</button>
            </div>`;
    } else {
        const r = it.rating || 0;
        html = `
            <div class="sheet-title">${esc(it.title)}</div>
            <label class="form-label">평점 ⭐</label>
            <div class="star-wrap" id="starWrap">
                ${[1,2,3,4,5].map(i => `<button class="star-btn" onclick="setRating(${i})">${i<=r?'⭐':'☆'}</button>`).join('')}
            </div>
            <label class="form-label">한줄평 ✍️</label>
            <input type="text" class="form-input" id="dReview" placeholder="한 줄 소감을 남겨보세요" value="${esc(it.review||'')}" oninput="detailItem.review=this.value">
            <label class="form-label">사진 📸</label>
            ${photoGrid}
            <div class="action-row">
                <button class="save-btn" onclick="saveDetail()">저장하기 💾</button>
                <button class="del-action-btn" onclick="deleteDetail()">삭제</button>
            </div>
            <label class="form-label">지도 링크 🔗</label>
            <div class="map-link-row">
                <input type="text" class="form-input" id="dMapUrl" placeholder="카카오맵/구글맵 공유 링크 붙여넣기" style="flex:1;margin-bottom:0;" value="${esc(it.mapUrl||'')}" oninput="detailItem.mapUrl=this.value">
                <button class="map-go-btn" onclick="openMapLink(detailItem.mapUrl)">이동 🚀</button>
            </div>`;
    }
    document.getElementById('detailContent').innerHTML = html;
}

function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('open');
    detailOpen = false;
}

function toggleDetailDone() {
    detailItem.completed = !detailItem.completed;
    const c = document.getElementById('dCircle'), l = document.getElementById('dLabel');
    if (c) { c.className = 'check-circle' + (detailItem.completed?' done':''); c.textContent = detailItem.completed?'✓':''; }
    if (l) { l.textContent = detailItem.completed ? '완료했어요! 🎉' : '아직 완료 전이에요'; }
}

function setRating(n) {
    detailItem.rating = n;
    const w = document.getElementById('starWrap');
    if (w) w.innerHTML = [1,2,3,4,5].map(i => `<button class="star-btn" onclick="setRating(${i})">${i<=n?'⭐':'☆'}</button>`).join('');
}

function saveDetail() {
    const payload = {
        description: detailItem.description || '',
        review:      detailItem.review      || '',
        rating:      detailItem.rating      || 0,
        completed:   detailItem.completed   || false,
        photos:      detailItem.photos      || []
    };
    if (detailType === 'spot' || detailType === 'dining') {
        payload.mapUrl = extractMapUrl(detailItem.mapUrl || '');
    }
    db.ref('couples/' + coupleCode + '/' + detailType + '/' + detailId).update(payload).then(() => {
        showToast('저장됐어요! 💾');
        closeDetail();
    }).catch(() => showToast('저장 오류'));
}

function extractMapUrl(text) {
    const m = (text || '').match(/https?:\/\/\S+/);
    return m ? m[0] : (text || '');
}

function openMapLink(url) {
    const clean = extractMapUrl(url);
    if (!clean) { showToast('먼저 지도 링크를 입력해주세요'); return; }
    window.location.href = clean;
}

function deleteDetail() {
    if (!confirm('삭제할까요?')) return;
    db.ref('couples/' + coupleCode + '/' + detailType + '/' + detailId).remove()
        .then(() => { showToast('삭제됐어요'); closeDetail(); });
}

function pickPhoto() { document.getElementById('photoInput').click(); }

function onPhotoFile(e) {
    const file = e.target.files[0]; if (!file) return;
    e.target.value = '';
    showToast('사진 추가 중...');
    compressImg(file).then(b64 => {
        detailItem.photos.push(b64);
        renderDetail();
        showToast('사진 추가됨 📸');
    });
}

function removePhoto(i) {
    detailItem.photos.splice(i,1);
    renderDetail();
}

function compressImg(file, maxW=500, q=0.65) {
    return new Promise(resolve => {
        const r = new FileReader();
        r.onload = ev => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxW) { h = Math.round(h*maxW/w); w = maxW; }
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(c.toDataURL('image/jpeg', q));
            };
            img.src = ev.target.result;
        };
        r.readAsDataURL(file);
    });
}

// ── helpers ──────────────────────────────────────────────────────
function estateLocRef(locId) {
    return db.ref('couples/' + coupleCode + '/estate/' + locId);
}
function locChecks(locId)  { return (estateData[locId]||{}).checks  || {}; }
function locExtras(locId)  { return (estateData[locId]||{}).extras  || {}; }

// ── view router ──────────────────────────────────────────────────
function renderCurrentEstateView() {
    const active = document.activeElement;
    if (active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')
        && document.getElementById('tab-estate')?.contains(active)) return;
    if (currentEstateCat && currentEstateLocId) renderEstateCatDetail(currentEstateCat);
    else if (currentEstateLocId) renderEstateCatList(currentEstateLocId);
    else renderEstateLocList();
}

// ── 1단계: 지역 목록 ─────────────────────────────────────────────
function renderEstateLocList() {
    currentEstateLocId = null;
    currentEstateCat   = null;
    document.querySelectorAll('#tab-estate .trip-view').forEach(v => v.classList.remove('active'));
    document.getElementById('estate-view-locs').classList.add('active');
    document.getElementById('mainContent').scrollTop = 0;

    const locs = Object.entries(estateData)
        .filter(([,v]) => v && v.title)
        .sort((a,b) => (a[1].dateAdded||0) - (b[1].dateAdded||0));

    const totalChecks = ESTATE_DATA.reduce((s,c)=>s+c.items.length, 0);
    const el = document.getElementById('estate-loc-list');

    if (locs.length === 0) {
        el.innerHTML = `<div style="text-align:center;color:var(--gray);padding:48px 0;font-size:14px;">
            + 버튼을 눌러 지역을 추가해보세요</div>`;
        return;
    }

    el.innerHTML = locs.map(([locId, loc]) => {
        const checks = locChecks(locId);
        const done   = ESTATE_DATA.reduce((s,c)=>s+c.items.filter(it=>checks[it.id]).length, 0);
        const pct    = Math.round(done/totalChecks*100);
        return `<div class="estate-cat-item" onclick="openEstateLoc('${locId}')">
            <span style="font-size:28px;">📍</span>
            <div style="flex:1;min-width:0;">
                <div class="item-title">${esc(loc.title)}</div>
                <div class="estate-progress">${done}/${totalChecks} 완료</div>
                <div class="estate-progress-bar"><div class="estate-progress-fill" style="width:${pct}%;"></div></div>
            </div>
            <button class="del-btn" style="position:static;margin-left:8px;"
                onclick="event.stopPropagation();delEstateLoc('${locId}')">✕</button>
        </div>`;
    }).join('');
}

function addEstateLoc() {
    const title = prompt('지역 이름을 입력하세요\n(예: 강남구 역삼동)');
    if (!title || !title.trim()) return;
    const locId = 'loc_' + Date.now();
    const loc   = { title: title.trim(), dateAdded: Date.now() };
    estateLocRef(locId).update(loc).then(() => {
        showToast('지역이 추가됐어요 📍');
    });
}

function delEstateLoc(locId) {
    const title = (estateData[locId]||{}).title || '';
    if (!confirm('"' + title + '" 지역을 삭제할까요?\n체크리스트도 모두 삭제됩니다.')) return;
    estateLocRef(locId).remove().then(() => showToast('삭제됐어요'));
}

function openEstateLoc(locId) {
    currentEstateLocId = locId;
    renderEstateCatList(locId);
}

function backToEstateLocList() { renderEstateLocList(); }

// ── 2단계: 카테고리 목록 ─────────────────────────────────────────
function renderEstateCatList(locId) {
    currentEstateCat = null;
    document.querySelectorAll('#tab-estate .trip-view').forEach(v => v.classList.remove('active'));
    document.getElementById('estate-view-cats').classList.add('active');
    document.getElementById('mainContent').scrollTop = 0;

    const locTitle = (estateData[locId]||{}).title || '';
    document.getElementById('estate-cats-title').textContent = locTitle;

    const checks = locChecks(locId);
    const el = document.getElementById('estate-cat-list');
    el.innerHTML = ESTATE_DATA.map(cat => {
        const total   = cat.items.length;
        const done    = cat.items.filter(it => checks[it.id]).length;
        const pct     = total > 0 ? Math.round(done/total*100) : 0;
        return `<div class="estate-cat-item" onclick="openEstateCat('${cat.id}')">
            <span style="font-size:28px;">${cat.icon}</span>
            <div style="flex:1;min-width:0;">
                <div class="item-title">${cat.title}</div>
                <div class="estate-progress">${done}/${total} 완료</div>
                <div class="estate-progress-bar"><div class="estate-progress-fill" style="width:${pct}%;"></div></div>
            </div>
            <span style="font-size:20px;color:var(--gray);">›</span>
        </div>`;
    }).join('');
}

function openEstateCat(catId) {
    currentEstateCat = catId;
    renderEstateCatDetail(catId);
}

function backToEstateCats() { renderEstateCatList(currentEstateLocId); }

// ── 3단계: 카테고리 상세 ─────────────────────────────────────────
function renderEstateCatDetail(catId) {
    document.querySelectorAll('#tab-estate .trip-view').forEach(v => v.classList.remove('active'));
    document.getElementById('estate-view-detail').classList.add('active');
    document.getElementById('mainContent').scrollTop = 0;
    const cat = ESTATE_DATA.find(c => c.id === catId);
    if (!cat) return;
    document.getElementById('estate-detail-title').textContent = cat.icon + ' ' + cat.title;

    const checks = locChecks(currentEstateLocId);
    const extras = locExtras(currentEstateLocId);

    let html = '';
    cat.items.forEach(item => {
        const chk = !!checks[item.id];
        html += `<div class="check-item" data-cid="${item.id}" onclick="toggleEstateCheck('${item.id}')">
            <div class="check-box${chk?' checked':''}">${chk?'✓':''}</div>
            <div class="check-text${chk?' checked':''}">${esc(item.text)}</div>
        </div>`;
    });

    if (cat.note) html += `<div class="estate-note">💡 ${esc(cat.note)}</div>`;

    if (cat.extras) {
        cat.extras.forEach(ex => {
            if (ex.type === 'memo') {
                const val = extras[ex.id] || '';
                html += `<div class="estate-section">${esc(ex.label)}</div>
                    <input type="text" class="form-input" placeholder="${esc(ex.label)} 입력..."
                        value="${esc(val)}"
                        oninput="saveEstateExtra('${ex.id}',this.value)"
                        onclick="event.stopPropagation()">`;
            } else if (ex.type === 'chips') {
                const selStr = extras[ex.id] || '';
                const selArr = selStr ? selStr.split(',') : [];
                html += `<div class="estate-section">${esc(ex.label)}</div>
                    <div class="chip-row" id="chip-row-${ex.id}">
                        ${ex.options.map((opt,i) =>
                            `<div class="chip${selArr.includes(opt)?' selected':''}" onclick="toggleEstateChip('${ex.id}',${i})">${opt}</div>`
                        ).join('')}
                    </div>`;
            } else if (ex.type === 'stars') {
                const r = parseInt(extras[ex.id]) || 0;
                html += `<div class="estate-section">${esc(ex.label)}</div>
                    <div class="star-wrap" id="estate-stars-${ex.id}">
                        ${[1,2,3,4,5].map(i => `<button class="star-btn" onclick="setEstateStars('${ex.id}',${i})">${i<=r?'⭐':'☆'}</button>`).join('')}
                    </div>`;
            } else if (ex.type === 'input_num') {
                const val = extras[ex.id] || '';
                html += `<div class="num-input-row">
                    <div class="num-input-label">${esc(ex.label)}</div>
                    <input type="number" class="num-input" min="0" max="999" value="${esc(val)}"
                        oninput="saveEstateExtra('${ex.id}',this.value)"
                        onclick="event.stopPropagation()">
                    <span class="num-unit">${esc(ex.unit)}</span>
                </div>`;
            }
        });
    }
    html += `<div style="height:20px;"></div>`;
    document.getElementById('estate-detail-content').innerHTML = html;
}

// ── 데이터 변경 함수 ─────────────────────────────────────────────
function toggleEstateCheck(itemId) {
    if (!currentEstateLocId) return;
    const loc    = estateData[currentEstateLocId] || {};
    const checks = loc.checks || {};
    const newVal = !checks[itemId];
    if (!estateData[currentEstateLocId]) estateData[currentEstateLocId] = { checks:{}, extras:{} };
    estateData[currentEstateLocId].checks = estateData[currentEstateLocId].checks || {};
    estateData[currentEstateLocId].checks[itemId] = newVal;
    estateLocRef(currentEstateLocId).child('checks/' + itemId).set(newVal);
    const el = document.querySelector('[data-cid="' + itemId + '"]');
    if (el) {
        const box = el.querySelector('.check-box'), txt = el.querySelector('.check-text');
        if (box) { box.className='check-box'+(newVal?' checked':''); box.textContent=newVal?'✓':''; }
        if (txt) { txt.className='check-text'+(newVal?' checked':''); }
    }
}

function saveEstateExtra(extraId, value) {
    if (!currentEstateLocId) return;
    if (!estateData[currentEstateLocId]) estateData[currentEstateLocId] = { checks:{}, extras:{} };
    estateData[currentEstateLocId].extras = estateData[currentEstateLocId].extras || {};
    estateData[currentEstateLocId].extras[extraId] = value;
    estateLocRef(currentEstateLocId).child('extras/' + extraId).set(value);
}

function toggleEstateChip(extraId, optIdx) {
    const cat    = ESTATE_DATA.find(c => c.id === currentEstateCat);
    const ex     = (cat?.extras||[]).find(e => e.id === extraId);
    if (!ex) return;
    const optVal = ex.options[optIdx];
    const selStr = locExtras(currentEstateLocId)[extraId] || '';
    const selArr = selStr ? selStr.split(',') : [];
    const idx    = selArr.indexOf(optVal);
    if (idx >= 0) selArr.splice(idx, 1); else selArr.push(optVal);
    const newVal = selArr.join(',');
    saveEstateExtra(extraId, newVal);
    const row = document.getElementById('chip-row-' + extraId);
    if (row) row.innerHTML = ex.options.map((opt,i) =>
        `<div class="chip${selArr.includes(opt)?' selected':''}" onclick="toggleEstateChip('${extraId}',${i})">${opt}</div>`
    ).join('');
}

function setEstateStars(extraId, n) {
    saveEstateExtra(extraId, n);
    const el = document.getElementById('estate-stars-' + extraId);
    if (el) el.innerHTML = [1,2,3,4,5].map(i =>
        `<button class="star-btn" onclick="setEstateStars('${extraId}',${i})">${i<=n?'⭐':'☆'}</button>`
    ).join('');
}

// ─── Trip ────────────────────────────────────────────────────────
function renderCurrentTripView() {
    if (currentDayId && currentTripId) renderActivities();
    else if (currentTripId) renderDays();
    else renderTrips();
}

function showTripView(view) {
    document.querySelectorAll('.trip-view').forEach(v => v.classList.remove('active'));
    document.getElementById('trip-view-' + view).classList.add('active');
    document.getElementById('mainContent').scrollTop = 0;
}

// ── Trip List ──
function renderTrips() {
    showTripView('list');
    const el = document.getElementById('trip-list');
    const sorted = Object.entries(tripData).sort((a,b) => (b[1].dateAdded||'') > (a[1].dateAdded||'') ? 1 : -1);
    if (!sorted.length) {
        el.innerHTML = `<div class="empty"><div class="empty-emoji">✈️</div><div class="empty-msg">첫 여행지를 추가해보세요!</div></div>`;
        return;
    }
    el.innerHTML = sorted.map(([id, trip]) => {
        const days = trip.days ? Object.keys(trip.days).length : 0;
        const date = trip.dateAdded ? new Date(trip.dateAdded).toLocaleDateString('ko-KR',{year:'numeric',month:'long'}) : '';
        return `<div class="list-item" onclick="openTrip('${id}')">
            <div class="item-row">
                <div style="flex:1;min-width:0;">
                    <div class="item-title">${esc(trip.title)}</div>
                    <div class="trip-card-sub">${days > 0 ? days+'일 일정' : '일정 없음'} · ${date}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:18px;color:var(--gray);">›</span>
                    <button class="del-btn" onclick="event.stopPropagation();delTrip('${id}')">✕</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function openTrip(tripId) {
    currentTripId = tripId;
    currentDayId  = null;
    renderDays();
}

function backToTrips() {
    currentTripId = null;
    currentDayId  = null;
    renderTrips();
}

// ── Day List ──
function renderDays() {
    showTripView('days');
    const trip = tripData[currentTripId];
    if (!trip) { backToTrips(); return; }
    document.getElementById('trip-days-title').textContent = trip.title;
    const el = document.getElementById('trip-days-list');
    const days = trip.days || {};
    const sorted = Object.entries(days).sort((a,b) => (a[1].date||'') > (b[1].date||'') ? 1 : -1);
    if (!sorted.length) {
        el.innerHTML = `<div class="empty"><div class="empty-emoji">📅</div><div class="empty-msg">날짜를 추가해보세요</div></div>`;
        return;
    }
    el.innerHTML = sorted.map(([id, day], idx) => {
        const d = new Date(day.date + 'T00:00:00');
        const dateStr = d.toLocaleDateString('ko-KR', {month:'long', day:'numeric'});
        const dow = ['일','월','화','수','목','금','토'][d.getDay()];
        const actCnt = day.activities ? Object.keys(day.activities).length : 0;
        return `<div class="list-item" onclick="openDay('${id}')">
            <div class="item-row">
                <div style="flex:1;min-width:0;">
                    <div class="item-title">여행 ${idx+1}일차</div>
                    <div class="trip-card-sub">${dateStr} (${dow}) · 일정 ${actCnt}개</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:18px;color:var(--gray);">›</span>
                    <button class="del-btn" onclick="event.stopPropagation();delDay('${id}')">✕</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function openDay(dayId) {
    currentDayId = dayId;
    renderActivities();
}

function backToDays() {
    currentDayId = null;
    renderDays();
}

// ── Activity List ──
function renderActivities() {
    showTripView('acts');
    const trip = tripData[currentTripId];
    if (!trip) { backToTrips(); return; }
    const day = (trip.days || {})[currentDayId];
    if (!day) { backToDays(); return; }
    // Day header
    const daysSorted = Object.entries(trip.days || {}).sort((a,b)=>a[1].date>b[1].date?1:-1);
    const dayIdx = daysSorted.findIndex(([id])=>id===currentDayId);
    const d = new Date(day.date + 'T00:00:00');
    const dateStr = d.toLocaleDateString('ko-KR', {month:'long', day:'numeric'});
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    document.getElementById('trip-acts-daynum').textContent = '여행 ' + (dayIdx+1) + '일차';
    document.getElementById('trip-acts-date').textContent = dateStr + ' (' + dow + ')';
    // Activities sorted by time
    const el = document.getElementById('trip-acts-list');
    const acts = day.activities || {};
    const sorted = Object.entries(acts).sort((a,b) => (a[1].time||'99:99') > (b[1].time||'99:99') ? 1 : -1);
    if (!sorted.length) {
        el.innerHTML = `<div class="empty"><div class="empty-emoji">📋</div><div class="empty-msg">일정을 추가해보세요</div></div>`;
        return;
    }
    el.innerHTML = sorted.map(([id, act]) => {
        const r = act.rating || 0;
        const stars = r > 0 ? `<div class="act-stars">${[1,2,3,4,5].map(i=>i<=r?'⭐':'☆').join('')}</div>` : '';
        return `<div class="act-item" onclick="openActivityDetail('${id}')">
            <div class="act-time-col"><div class="act-time">${esc(act.time||'--:--')}</div></div>
            <div class="act-body">
                <div class="act-title">${esc(act.title)}</div>
                ${act.memo ? `<div class="act-memo">${esc(act.memo)}</div>` : ''}
                ${stars}
            </div>
            <button class="act-del" onclick="event.stopPropagation();delActivity('${id}')">✕</button>
        </div>`;
    }).join('');
}

    const title = document.getElementById('actTitleInput').value.trim();
    const time  = document.getElementById('actTimeInput').value;
    const memo  = document.getElementById('actMemoInput').value.trim();
    if (!title) { showToast('할 것을 입력해주세요'); return; }
    const id = Date.now().toString();
    db.ref('couples/' + coupleCode + '/trip/' + currentTripId + '/days/' + currentDayId + '/activities/' + id)
        .set({ title, time, memo, rating:0, dateAdded: new Date().toISOString() })
        .then(() => showToast('일정 추가됐어요! ✨')).catch(() => showToast('오류'));
    closeActModal();
}

// ── Delete ──
function delTrip(tripId) {
    if (!confirm('여행을 삭제할까요?')) return;
    db.ref('couples/' + coupleCode + '/trip/' + tripId).remove().then(() => showToast('삭제됐어요'));
}
function delDay(dayId) {
    if (!confirm('이 날짜를 삭제할까요?')) return;
    db.ref('couples/' + coupleCode + '/trip/' + currentTripId + '/days/' + dayId).remove().then(() => showToast('삭제됐어요'));
}
function delActivity(actId) {
    if (!confirm('일정을 삭제할까요?')) return;
    db.ref('couples/' + coupleCode + '/trip/' + currentTripId + '/days/' + currentDayId + '/activities/' + actId).remove().then(() => showToast('삭제됐어요'));
}

// ── Activity Detail (edit) ──
function openActivityDetail(actId) {
    const trip = tripData[currentTripId];
    const day  = (trip?.days||{})[currentDayId];
    const act  = (day?.activities||{})[actId];
    if (!act) return;
    detailType = 'activity';
    detailId   = actId;
    detailItem = JSON.parse(JSON.stringify(act));
    detailOpen = true;
    const r = act.rating || 0;
    document.getElementById('detailContent').innerHTML = `
        <div class="sheet-title">${esc(act.title)}</div>
        <label class="form-label">시간 🕐</label>
        <input type="time" class="form-input" id="dActTime" value="${esc(act.time||'')}">
        <label class="form-label">메모 📝</label>
        <input type="text" class="form-input" id="dActMemo" placeholder="간단한 메모" value="${esc(act.memo||'')}">
        <label class="form-label">평점 ⭐</label>
        <div class="star-wrap" id="actStarWrap">
            ${[1,2,3,4,5].map(i=>`<button class="star-btn" onclick="setActRating(${i})">${i<=r?'⭐':'☆'}</button>`).join('')}
        </div>
        <div class="action-row">
            <button class="save-btn" onclick="saveActivityDetail('${actId}')">저장하기 💾</button>
            <button class="del-action-btn" onclick="deleteActivityDetail('${actId}')">삭제</button>
        </div>`;
    document.getElementById('detailOverlay').classList.add('open');
}
function setActRating(n) {
    detailItem.rating = n;
    const w = document.getElementById('actStarWrap');
    if (w) w.innerHTML = [1,2,3,4,5].map(i=>`<button class="star-btn" onclick="setActRating(${i})">${i<=n?'⭐':'☆'}</button>`).join('');
}
function saveActivityDetail(actId) {
    const time = document.getElementById('dActTime').value;
    const memo = document.getElementById('dActMemo').value.trim();
    db.ref('couples/' + coupleCode + '/trip/' + currentTripId + '/days/' + currentDayId + '/activities/' + actId)
        .update({ time, memo, rating: detailItem.rating || 0 })
        .then(() => { showToast('저장됐어요! 💾'); closeDetail(); }).catch(() => showToast('오류'));
}
function deleteActivityDetail(actId) {
    if (!confirm('일정을 삭제할까요?')) return;
    db.ref('couples/' + coupleCode + '/trip/' + currentTripId + '/days/' + currentDayId + '/activities/' + actId)
        .remove().then(() => { showToast('삭제됐어요'); closeDetail(); });
}

// ─── Utils ──────────────────────────────────────
function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
}

// ─── Start ──────────────────────────────────────
window.addEventListener('load', () => {
    if (!db) {
        const w = document.createElement('div');
        w.className = 'warn-box';
        w.innerHTML = '⚠️ <b>Firebase 설정 필요</b><br>index.html 파일의 firebaseConfig 값을 Firebase 콘솔에서 복사한 실제 값으로 교체해주세요.';
        document.getElementById('setupScreen').insertBefore(w, document.querySelector('.setup-logo'));
    }

    coupleCode = localStorage.getItem('coupleCode');
    if (coupleCode && db) {
        initApp();
    }
});

// ── 아이콘 동적 생성 (캔버스로 PNG 생성) ──
(function() {
    try {
        function drawIcon() {
            const c = document.createElement('canvas');
            c.width = 180; c.height = 180;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 180, 180);
            grad.addColorStop(0, '#0D0129');
            grad.addColorStop(0.5, '#1A0440');
            grad.addColorStop(1, '#2D0A6B');
            ctx.fillStyle = grad;
            const r = 36;
            ctx.beginPath();
            ctx.moveTo(r,0); ctx.lineTo(180-r,0); ctx.arcTo(180,0,180,r,r);
            ctx.lineTo(180,180-r); ctx.arcTo(180,180,180-r,180,r);
            ctx.lineTo(r,180); ctx.arcTo(0,180,0,180-r,r);
            ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#E2D0FF';
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            let size = 72;
            let m;
            const fit = () => {
                ctx.font = `${size}px 'Great Vibes', cursive`;
                m = ctx.measureText('record');
            };
            fit();
            const visualWidth = w => w.actualBoundingBoxLeft + w.actualBoundingBoxRight;
            while (visualWidth(m) > 152 && size > 24) {
                size -= 2;
                fit();
            }
            const x0 = 90 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
            const y0 = 90 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
            ctx.fillText('record', x0, y0);
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = c.toDataURL('image/png');
            document.head.appendChild(link);
        }
        if (document.fonts && document.fonts.load) {
            document.fonts.load("72px 'Great Vibes'").then(drawIcon).catch(drawIcon);
        } else {
            drawIcon();
        }
    } catch(e) {}
})();

    try {
        const sw = `self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));`;
        const blob = new Blob([sw], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    } catch(e) {}
}
